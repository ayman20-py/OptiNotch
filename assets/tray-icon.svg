<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Top Bezel / Screen Edge (Bold & Centered) -->
  <path 
    d="M2 5 H30" 
    stroke="#71717A" 
    stroke-width="3" 
    stroke-linecap="round" 
  />

  <!-- Light Grey Notch Pill (Enlarged to fill tray bounds) -->
  <rect 
    x="3" 
    y="11" 
    width="26" 
    height="15" 
    rx="7.5" 
    fill="#E4E4E7" 
    stroke="#71717A" 
    stroke-width="2.5" 
  />

  <!-- Active Amber Status Dot (Scaled up for small preview visibility) -->
  <circle 
    cx="16" 
    cy="18.5" 
    r="3" 
    fill="#F59E0B" 
  />
</svg>
